services:
  # ── BACKEND: Node.js + WhatsApp-Web.js en Render ──
  - type: web
    name: bot-whatsapp-mensajes-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=192 server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
