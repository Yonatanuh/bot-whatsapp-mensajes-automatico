services:
  # ── BACKEND: Node.js + WhatsApp-Web.js en Render ──
  - type: web
    name: bot-whatsapp-mensajes-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node --max-old-space-size=256 server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
